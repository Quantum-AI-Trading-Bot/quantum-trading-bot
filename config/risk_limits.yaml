# Portfolio Risk Limits - USD Notional Normalization
# Conservative limits for paper trading deployment

# Global exposure limits
max_gross_exposure_usd: 250000      # 25% of 1M portfolio
max_net_exposure_usd: 150000       # 15% net long/short
max_daily_loss_usd: 5000            # 0.5% daily loss limit
max_drawdown_usd: 25000            # 2.5% drawdown limit

# Position limits
max_position_usd_per_symbol: 50000  # 5% max per symbol
max_order_notional_usd: 25000      # 2.5% max single order

# Trading limits
max_orders_per_day_global: 50
cooldown_minutes_after_loss: 30    # Cooldown after hitting daily loss limit

# Risk monitoring
enable_drawdown_tracking: true
enable_exposure_tracking: true
enable_daily_loss_tracking: true

# State management
risk_state_file: state/risk_state.json

# Safety
# If equity/positions unavailable or stale -> FAIL CLOSED
stale_data_threshold_minutes: 10
require_paper_proof: true

# Notes
notes: "Conservative risk limits for autonomous paper trading"
effective_date: "2026-01-26"
review_date: "2026-02-01"
